name: Build and upload PyPI package

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read # access to check out code and install dependencies

jobs:
  build:
    # RPPS is pure python: one wheel (py3-none-any) and an sdist
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test-wheel:
    name: Test the wheel on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist
      - name: Install the wheel with the test requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest scipy matplotlib dist/*.whl
      - name: Run the tests against the installed package
        shell: bash
        run: |
          # Away from the checkout, so `import rpps` can only find the installed package. The docs tests read these
          mkdir run && cp -r tests README.md guides pyproject.toml run/ && cd run
          python -m pytest -q -m "not slow" tests/unit

  pypi-publish:
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rpps/${{ github.event.release.name }}
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
