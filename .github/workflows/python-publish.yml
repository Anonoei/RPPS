name: Build and upload PyPI package

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read # access to check out code and install dependencies

jobs:
  build_wheels:
    # rpps._native (csrc/) is compiled: one wheel per platform and Python, as in pysdrlib
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest, ubuntu-24.04-arm, windows-latest,
          #windows-11-arm, macos-15-intel, macos-latest
        ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel==3.3.1

      - name: list target wheels
        run: python -m cibuildwheel . --print-build-identifiers
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test-wheel:
    name: Test the wheel on ${{ matrix.os }}
    needs: [build_wheels, build_sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v6
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist
      - name: Install the wheel with the test requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest scipy matplotlib
          pip install --no-index --find-links dist --only-binary :all: rpps --no-deps
          pip install rpps --find-links dist # its dependencies (numpy, pysdrlib)
          python -c "import rpps._native" # the kernels are in the wheel
      - name: Run the tests against the installed package
        shell: bash
        run: |
          # Away from the checkout, so `import rpps` can only find the installed package. The docs tests read these
          mkdir run && cp -r tests README.md pyproject.toml run/ && cd run
          python -m pytest -q -m "not slow" tests/unit

  pypi-publish:
    needs: [build_wheels, build_sdist, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rpps/${{ github.event.release.name }}
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v6
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
