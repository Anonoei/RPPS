name: Build and upload PyPI package

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read # access to check out code and install dependencies

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Wheel targets, the wheel smoke test and the skipped platforms live in [tool.cibuildwheel] in pyproject.toml
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest, ubuntu-24.04-arm, windows-latest,
          #windows-11-arm, macos-15-intel, macos-latest
        ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  pypi-publish:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/rpps/${{ github.event.release.name }}
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "$version" ]; then
            echo "::error::release tag '$TAG' does not match pyproject.toml version '$version'"
            exit 1
          fi

      - name: Retrieve release distributions
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: cibw-*
          merge-multiple: true

      - name: Check distribution metadata
        run: pipx run twine check dist/*

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
