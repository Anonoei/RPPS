name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # head_ref is the PR's branch, ref_name the pushed one: a push and the pull_request run it triggers share a group, so one cancels the other
  group: tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows runners take 12-16 minutes for one pass of the fast tests
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Dependencies, extras and the build requirements (setuptools, pybind11) all come from pyproject.toml.
      # The editable install builds rpps._native in place; RPPS_REQUIRE_NATIVE makes a failed build an error.
      - name: Install package
        env:
          RPPS_REQUIRE_NATIVE: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viz,test]"

      - name: Fast tests
        run: python -m pytest -q -n auto -m "not slow" --durations=10

      - name: Oracle tests against scipy
        # scipy is not a dependency; the tests that compare against it (marked `oracle`) use pytest.importorskip, so
        # they skip above and run here
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -e ".[oracle]"
          python -m pytest -q -m oracle -rs

  no-native:
    # The fast tests with the C++ kernels off (the Python loops they replace): several times slower, so a job of its own.
    # Tests marked `kernels` (over a minute each without them, 73 minutes in all) are left out here and run in the matrix above
    name: Python 3.12 without the kernels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viz,test]"
      - name: Fast tests without the kernels
        env:
          RPPS_NO_NATIVE: "1"
        run: python -m pytest -q -n auto -m "not slow and not kernels" --durations=20

  package:
    # The built wheel has to carry config/ and run the README example from a clean environment
    name: Wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: Build sdist, then the wheel from the sdist
        run: python -m build
      - name: Wheel carries the definitions
        run: |
          python - <<'PY'
          import glob, zipfile, tarfile
          whl = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          for name, files in (("wheel", whl), ("sdist", sdist)):
              n = sum(1 for f in files if "config/" in f and f.endswith(".json"))
              print(name, n, "definitions")
              assert n > 40, f"{name} is missing config/"
          PY
      - name: Install into a clean environment and run the examples
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/examples/quickstart.py"
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/examples/list_definitions.py" > /dev/null
          /tmp/clean/bin/python -c "import rpps, sys; assert 'matplotlib' not in sys.modules"

  docs:
    # Same build as deploy-docs (strict), so a broken docstring cross-reference or snippet path fails the pull request
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - run: python tools/builder.py -d
      - run: test -f site/api/base/index.html && test -s site/llms-full.txt
