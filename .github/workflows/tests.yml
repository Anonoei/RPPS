name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # head_ref is the PR's branch, ref_name the pushed one: a push and the pull_request run it triggers share a group, so one cancels the other
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Dependencies, extras and the build requirements (setuptools, pybind11) all come from pyproject.toml.
      # The editable install builds rpps._native in place; RPPS_REQUIRE_NATIVE makes a failed build an error.
      - name: Install package
        env:
          RPPS_REQUIRE_NATIVE: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viz,test]"

      - name: Fast tests
        run: python -m pytest -q -m "not slow" --durations=10

      - name: Fast tests without the kernels (the Python loops)
        if: matrix.python-version == '3.12'
        env:
          RPPS_NO_NATIVE: "1"
        run: python -m pytest -q -m "not slow"

      - name: Oracle tests against scipy
        # scipy is not a dependency; these tests compare remez, resample_poly, convolve and the IIR designs with it
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -e ".[oracle]"
          python -m pytest -q -m "not slow" tests/unit/test_remez.py tests/unit/test_numpy_only.py tests/unit/test_iir.py tests/unit/test_channel_sync.py tests/unit/test_filters_config.py

      - name: Slow tests (chain decoding)
        if: matrix.python-version == '3.12'
        run: python -m pytest -q -m slow

  package:
    # The built wheel has to carry config/ and run the README example from a clean environment
    name: Wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: Build sdist, then the wheel from the sdist
        run: python -m build
      - name: Wheel carries the definitions
        run: |
          python - <<'PY'
          import glob, zipfile, tarfile
          whl = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          for name, files in (("wheel", whl), ("sdist", sdist)):
              n = sum(1 for f in files if "config/" in f and f.endswith(".json"))
              print(name, n, "definitions")
              assert n > 40, f"{name} is missing config/"
          PY
      - name: Install into a clean environment and run the examples
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/tests/example.py"
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/tests/example_ls.py" > /dev/null
          /tmp/clean/bin/python -c "import rpps, sys; assert 'matplotlib' not in sys.modules"

  docs:
    # Same build as deploy-docs, so a docstring that breaks pdoc fails the pull request
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viz,docs]"
      - run: python -m pdoc -o docs --html --force --template-dir pdoc_templates src/rpps
      - run: test -f docs/rpps/index.html
