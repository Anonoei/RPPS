name: Deploy docs

on:
  push:
    branches:
      - main  # Pull requests only check that the docs build: see the Tests workflow
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read # access to check out code and install dependencies
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs so a failed deploy can be re-run alone: re-running a job that uploads the
  # "github-pages" artifact adds a second one to the run, and deploy-pages refuses to choose between two.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pdoc3
          python -m pip install "pysdrlib>=0.4.3" || python -m pip install "git+https://github.com/Anonoei/pysdrlib.git"

      # Editable, so pdoc documents src/rpps; the C++ kernels are optional (the Python loops are the fallback)
      - name: Install package
        run: python -m pip install -e ".[viz]"

      - name: Build docs
        run: python -m pdoc -o docs --html --force --template-dir pdoc_templates src/rpps

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/rpps'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
