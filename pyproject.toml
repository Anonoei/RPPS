[build-system]
requires = ["setuptools>=77.0", "numpy", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "rpps"
version = "0.3.0"
description = "RF Parameter Processor Suite"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Anonoei", email="to+dev@an0.us"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["anonoei", "dsp", "sdr"]
dependencies = ["numpy>=2.0", "pysdrlib>=0.4.0"]

[project.scripts]
rpps = "rpps.cli:main"

[project.urls]
Homepage = "https://github.com/anonoei/RPPS"
Documentation = "https://anonoei.github.io/RPPS/"
Repository = "https://github.com/Anonoei/RPPS.git"
Issues = "https://github.com/Anonoei/RPPS/issues"
Source = "https://github.com/anonoei/RPPS"

[project.optional-dependencies]
viz = ["matplotlib"]
dev = ["matplotlib", "twine", "build", "bumpver", "pytest", "pdoc3", "scipy"] # scipy: only the tests that check against it

[tool.setuptools.packages.find]
where = ["src"]


[tool.bumpver]
current_version = "0.3.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"src/rpps/__init__.py" = ["{version}"]

[tool.cibuildwheel]
# Wheels for every CPython in requires-python (python-publish.yml); each must carry rpps._native
environment = { RPPS_REQUIRE_NATIVE = "1" }
test-command = "python -c \"import rpps._native\""

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
markers = ["slow: takes more than a few seconds"]
