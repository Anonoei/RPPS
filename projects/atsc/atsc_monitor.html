<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ATSC monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#10151b;--panel:#18202a;--line:#27323f;--fg:#dbe4ee;--dim:#7f8d9c;--ok:#4cc38a;--warn:#e0b341;--bad:#e5645c;--acc:#5aa9ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{display:flex;gap:1.2rem;align-items:baseline;padding:.7rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0}
header span{color:var(--dim)}
main{display:grid;grid-template-columns:minmax(380px,1fr) minmax(420px,1.2fr);gap:1rem;padding:1rem}
@media(max-width:1000px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;min-width:0}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 .5rem}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--dim);text-align:left;font-size:.8rem;padding:.2rem .4rem}
td{padding:.3rem .4rem;border-top:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover{background:#1f2a36}tr.sel{background:#22303f}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:0 .5rem;border-radius:99px;font-size:.78rem;border:1px solid var(--line)}
.OK,.playing,.locked{color:var(--ok);border-color:var(--ok)}.marginal,.weak,.acquire,.lost{color:var(--warn);border-color:var(--warn)}.nolock,.no{color:var(--bad);border-color:var(--bad)}
.bar{display:inline-block;width:56px;height:8px;background:#0c1116;border-radius:4px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
button{background:#25313f;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:.25rem .7rem;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}button.go{background:#1d4a78;border-color:#2c6aa8}button.stop{background:#6a2a2a;border-color:#8a3a3a}
video{width:100%;background:#000;border-radius:6px;aspect-ratio:16/9}
canvas{width:100%;height:120px;background:#0c1116;border-radius:6px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.4rem;margin:.5rem 0}
.k{background:#0f151b;border-radius:6px;padding:.3rem .5rem}.k b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}.k span{font-size:.72rem;color:var(--dim)}
.log{max-height:200px;overflow:auto;font-size:.82rem;color:var(--dim)}.log div{padding:.1rem 0;border-top:1px solid #1d2630}
.watch{color:var(--acc)}.error,.browser{color:var(--bad)}.ffmpeg{color:#e0b040}.station{color:var(--ok)}
.muted{color:var(--dim)}
</style>
</head>
<body>
<header><h1>ATSC monitor</h1><span id="radio"></span><span id="mode"></span><span id="sweep"></span><span id="warn" class="error"></span><span style="flex:1"></span><button id="rescan">Rescan</button></header>
<main>
<div style="display:grid;gap:1rem;align-content:start">
<section><h2>Stations</h2>
<table><thead><tr><th>CH</th><th>MHz</th><th class="num">Pilot</th><th class="num">SNR</th><th>RS ok</th><th>Status</th><th>Virtual channels</th></tr></thead><tbody id="stations"></tbody></table>
<div id="empty" class="muted" style="padding:.6rem 0">Sweeping for stations&hellip;</div></section>
<section><h2 id="ptitle">Programs</h2><div id="programs" class="muted">Select a station.</div></section>
<section><h2>Events</h2><div id="log" class="log"></div></section>
</div>
<div style="display:grid;gap:1rem;align-content:start">
<section><h2 id="wtitle">Watch</h2>
<video id="v" controls muted autoplay playsinline></video>
<div style="display:flex;gap:.5rem;align-items:center;margin:.25rem 0"><label for="vol" class="muted">Volume</label><input id="vol" type="range" min="0" max="800" step="10" value="300" style="flex:1;max-width:20rem"><span id="volv" class="muted">300%</span></div>
<div style="display:flex;gap:.5rem;align-items:center;margin:.5rem 0"><button id="stop" class="stop" hidden>Stop watching</button><span id="wmsg" class="muted"></span></div>
<div class="grid" id="chips"></div>
<canvas id="spec"></canvas>
<canvas id="hist" style="margin-top:.5rem"></canvas>
<div class="muted" style="font-size:.78rem;margin-top:.3rem">Spectrum of the 20 MHz capture (the channel is the highlighted 6 MHz) &middot; history: SNR (green, 0&ndash;25 dB) and Reed-Solomon yield (blue, 0&ndash;100%)</div>
</section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
let S=null,selected=null,watching=null,vctl=null;
const fmt=(v,d=1)=>v==null?'-':Number(v).toFixed(d);
const api=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
$('rescan').onclick=()=>api('/api/rescan');
$('stop').onclick=async()=>{await api('/api/stop');stopVideo()};

function statusClass(s){return s==='no lock'?'nolock':s}
function render(){
  if(!S)return;
  $('radio').textContent=S.radio;$('mode').textContent=S.mode==='watch'?'watching (sweep paused)':'scanning';
  $('sweep').textContent=S.mode==='scan'?(S.current?`tuned to channel ${S.current}`:`sweep ${S.sweeps}`):'';
  $('warn').textContent=S.ffmpeg?'':'ffmpeg not found: no video';
  $('empty').hidden=S.stations.length>0;
  const tb=$('stations');tb.innerHTML='';
  for(const s of S.stations){
    const tr=document.createElement('tr');tr.className='row'+(s.ch===selected?' sel':'');
    const names=s.programs.filter(p=>p.vc).map(p=>`${p.vc} ${p.name}`).join(' · ');
    const rs=s.rs_ok==null?'':`<span class="bar"><i style="width:${Math.round(s.rs_ok*100)}%"></i></span> ${Math.round(s.rs_ok*100)}%`;
    tr.innerHTML=`<td>${s.ch}</td><td class="num">${s.lower}</td><td class="num">${fmt(s.pilot,0)}</td><td class="num">${fmt(s.snr)}</td><td>${rs}</td><td><span class="pill ${statusClass(s.status)}">${s.probing?'probing':s.status}</span></td><td class="muted">${names}</td>`;
    tr.onclick=()=>{selected=s.ch;render()};tb.appendChild(tr);
  }
  const st=S.stations.find(s=>s.ch===selected);
  const pe=$('programs');
  if(!st){$('ptitle').textContent='Programs';pe.innerHTML='<span class="muted">Select a station.</span>';}
  else{
    $('ptitle').textContent=`Channel ${st.ch} (${st.lower}–${st.lower+6} MHz)`;
    if(!st.programs.length){pe.innerHTML=`<span class="muted">${st.probing?'Probing…':'No program table yet: '+(st.status==='no lock'?'the receiver cannot lock (signal too weak or too much multipath).':'waiting for the probe.')}</span>`}
    else{
      pe.innerHTML='<table>'+st.programs.map(p=>`<tr><td>${p.vc||'?'}</td><td>${p.name||''}</td><td class="muted">program ${p.program}</td><td class="muted">${p.streams.join(', ')||'PMT not seen'}</td><td><button class="go" data-ch="${st.ch}" data-p="${p.program}">Watch</button></td></tr>`).join('')+'</table>';
      pe.querySelectorAll('button.go').forEach(b=>b.onclick=()=>watch(+b.dataset.ch,+b.dataset.p));
    }
  }
  const lg=$('log');lg.innerHTML=S.events.map(e=>`<div class="${e.kind}">${e.age.toFixed(0)} s ago &middot; ${esc(e.text)}</div>`).join('');
  renderWatch();
}
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const note=t=>{try{fetch('/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})})}catch(_){}};
window.addEventListener('error',e=>note('page: '+e.message));window.addEventListener('unhandledrejection',e=>note('page: '+e.reason));
// Volume: the stream is quiet (AC-3 re-encoded to AAC), so the slider goes to 800% through Web Audio (gain, then a limiter against clipping); moving it also unmutes
let actx=null,gain=null;
function setVol(){
  const v=$('v'),r=$('vol');const g=+r.value/100;$('volv').textContent=r.value+'%';
  try{
    if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();const src=actx.createMediaElementSource(v);gain=actx.createGain();
      const lim=actx.createDynamicsCompressor();lim.threshold.value=-6;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=0.003;lim.release.value=0.1;
      src.connect(gain);gain.connect(lim);lim.connect(actx.destination)}
    gain.gain.value=g;if(actx.state==='suspended')actx.resume();
  }catch(e){v.volume=Math.min(1,g);note('volume: Web Audio unavailable: '+e)}
  v.muted=false;try{localStorage.setItem('vol',r.value)}catch(_){}
}
try{const sv=localStorage.getItem('vol');if(sv)$('vol').value=sv;$('volv').textContent=$('vol').value+'%'}catch(_){}
$('vol').addEventListener('input',setVol);
$('v').addEventListener('play',()=>{if(actx&&actx.state==='suspended')actx.resume()});
function chip(l,v){return `<div class="k"><b>${v}</b><span>${l}</span></div>`}
function renderWatch(){
  const w=S.watch;$('stop').hidden=!w;
  if(!w){$('wtitle').textContent='Watch';$('chips').innerHTML='';$('wmsg').textContent='Pick a program and press Watch.';draw(null);if(watching){stopVideo()}return}
  $('wtitle').textContent=`Watching channel ${w.ch}`+(w.vc?` – ${w.vc}`:'');
  const l=w.load||{};
  $('chips').innerHTML=chip('state',`<span class="pill ${w.state==='locked'?'OK':w.state==='lost'||w.state==='acquire'?'weak':'nolock'}">${w.state}</span>`)+chip('SNR dB',fmt(w.snr))+chip('RS ok',w.rs_ok==null?'-':Math.round(w.rs_ok*100)+'%')
   +chip('Mb/s',fmt(w.mbps))+chip('behind s',fmt(w.lag))+chip('clock ppm',fmt(w.clock_ppm,2))+chip('load f/r/d',`${fmt(l.front,2)}/${fmt(l.region,2)}/${fmt(l.decode,2)}`)
   +chip('lost / overruns / drops',`${w.lost||0} / ${w.overruns} / ${w.dropped}`)+chip('clipped',w.clip==null?'-':(w.clip*100).toFixed(3)+'%')+chip('video frags',w.video.fragments);
  let m='';
  if(w.error)m=w.error;else if(w.video.error&&!w.video.ready)m='ffmpeg: '+w.video.error;else if(!w.video.ready)m=w.program==null?'locking and reading the program table… (about 5–10 s)':'waiting for the first video fragment…';else m='playing';
  $('wmsg').textContent=m;
  if(w.video.ready&&!watching)startVideo();
  draw(w);
}
async function watch(ch,program){
  stopVideo();
  const r=await api('/api/watch',{ch,program});if(r.error)alert(r.error);
}
function stopVideo(){if(vctl){vctl.abort();vctl=null}watching=false;const v=$('v');v.removeAttribute('src');v.load()}
async function startVideo(){
  watching=true;vctl=new AbortController();
  const v=$('v');const ms=new MediaSource();v.src=URL.createObjectURL(ms);
  await new Promise(r=>ms.addEventListener('sourceopen',r,{once:true}));
  let sb;
  try{sb=ms.addSourceBuffer('video/mp4; codecs="avc1.42E01F, mp4a.40.2"')}catch(e){note('addSourceBuffer: '+e);$('wmsg').textContent='This browser cannot play the stream: '+e;return}
  const q=[];let ended=false;let nseg=0,perr=0;
  note('video: MediaSource started; mp4 supported='+MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01F, mp4a.40.2"'));
  const diag=()=>{const b=v.buffered;note(`video: ${nseg} segments in, readyState ${v.readyState}, paused ${v.paused}, muted ${v.muted}, time ${v.currentTime.toFixed(1)}, buffered ${b.length?b.start(0).toFixed(1)+'-'+b.end(b.length-1).toFixed(1):'none'}, ${v.videoWidth}x${v.videoHeight}`+(perr?', play() refused '+perr+'x':''))};
  [3000,10000,30000].forEach(t=>setTimeout(()=>{if(watching)diag()},t));
  const pump=()=>{
    if(sb.updating||!q.length||ms.readyState!=='open')return;
    try{sb.appendBuffer(q.shift());nseg++}catch(e){if(e.name==='QuotaExceededError'){trim(true)}else note('appendBuffer: '+e.name+' '+e.message)}
  };
  const trim=force=>{
    if(sb.updating||!sb.buffered.length)return;
    const s=sb.buffered.start(0),e=sb.buffered.end(sb.buffered.length-1);
    if(force||e-s>30)try{sb.remove(s,Math.max(s,e-15))}catch(_){}
  };
  sb.addEventListener('error',()=>note('SourceBuffer error'));v.onerror=()=>note('video element error: '+(v.error?v.error.code+' '+v.error.message:''));
  sb.addEventListener('updateend',()=>{
    if(v.buffered.length){const e=v.buffered.end(v.buffered.length-1);if(e-v.currentTime>2.5)v.currentTime=e-0.8}
    trim(false);pump();v.play().catch(e=>{perr++;if(perr===1)note('play() refused: '+e.name+' '+e.message)})
  });
  try{
    const r=await fetch('/video',{signal:vctl.signal});if(!r.ok)throw new Error(r.status);
    const rd=r.body.getReader();
    for(;;){const {done,value}=await rd.read();if(done)break;q.push(value);pump()}
  }catch(e){if(e.name!=='AbortError'){note('video stream: '+e);$('wmsg').textContent='video stream ended'}}
  watching=false;
}
function draw(w){
  const c=$('spec'),h=$('hist');
  for(const cv of [c,h]){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio}
  let g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  const sp=w&&w.spectrum;
  if(sp){
    const n=sp.db.length,mn=Math.min(...sp.db),mx=Math.max(...sp.db),H=c.height,W=c.width;
    const x=f=>(f-sp.f0)/(sp.step*n)*W,y=v=>H-6-(v-mn)/(mx-mn+1e-9)*(H-12);
    g.fillStyle='#1e3a57';g.fillRect(x(sp.lower),0,x(sp.upper)-x(sp.lower),H);
    g.strokeStyle='#5aa9ff';g.lineWidth=devicePixelRatio;g.beginPath();
    sp.db.forEach((v,i)=>{const X=i/n*W;i?g.lineTo(X,y(v)):g.moveTo(X,y(v))});g.stroke();
  }
  g=h.getContext('2d');g.clearRect(0,0,h.width,h.height);
  const hs=w&&w.history;
  if(hs&&hs.length>1){
    const W=h.width,H=h.height,n=hs.length;
    const line=(key,scale,col)=>{g.strokeStyle=col;g.lineWidth=2*devicePixelRatio;g.beginPath();let st=false;hs.forEach((p,i)=>{const v=p[key];if(v==null){st=false;return}const X=i/(n-1)*W,Y=H-4-Math.max(0,Math.min(1,v/scale))*(H-8);st?g.lineTo(X,Y):g.moveTo(X,Y);st=true});g.stroke()};
    g.strokeStyle='#27323f';g.lineWidth=1;g.beginPath();g.moveTo(0,H*(1-15/25));g.lineTo(W,H*(1-15/25));g.stroke(); // 15 dB: ATSC's threshold
    line('snr',25,'#4cc38a');line('rs',1,'#5aa9ff');
  }
}
async function tick(){
  try{S=await (await fetch('/api/state')).json();render()}catch(e){}
  setTimeout(tick,S&&S.watch?500:1000);
}
tick();
</script>
</body>
</html>
